                   false, false, false,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]

    imu0: /ouster/imu
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]